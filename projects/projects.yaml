  - date: Sep-Oct, 2025
    name: Personal Website
    tagline: This site! Built from the ground up in SvelteKit.
    description: >-
      The site you're looking at is built in SvelteKit, a lightweight web
      framework. I chose Svelte because I wanted to improve my skills with it
      and create something unique. I also wanted more flexibility to customize
      my site and so I could store all my projects in a single file, which I
      could later reuse.


      All of the projects you see in this gallery are stored in a “Yet Another
      Markup Language” (YAML) file, a human-editable text format that machines
      can also read. I built an editor around this file, so in development mode,
      I can manage projects through an intuitive and easy-to-use interface. You
      can check out the editor by visiting the linked GitHub repo and following
      the setup instructions.


      When I was testing out my site for speed with a simulated slow network, I
      found that it took over 20 seconds to load some of the images. I then made
      an automation to solve this which will automatically compress my images
      with Image Magick (a command line tool for manipulating images) by a
      factor of 10-20x without significant quality compromise.
    thumbnail: /thumbnails/1760028884932-webp.webp
    categories:
      - Programming
    websiteURL: evangan.com
    githubURL: github.com/evan-gan/evangan.com
  - date: Aug 8-11, 2025
    name: Shipwrecked
    tagline: >-
      Conceived and led a 130-person hackathon; secured $140K funding, managed
      logistics, recruited participants, and coordinated all event operations.
      (Third hackathon organized)
    description: >-
      I once had the wild idea of running a hackathon on an island. A year
      later, I spent the entire summer at [Hack Club](https://hackclub.com)
      bringing that idea to life by organizing a four-day hackathon at the
      Cathleen Stone Outward Bound School on Thompson Island in Boston Harbor. I
      helped coordinate the event for 130 participants, securing $140K in
      funding, handling logistics, recruiting attendees, and keeping everything
      running smoothly while learning a lot about teamwork, planning, and what
      it takes to turn an ambitious idea into reality.


      I directed a team of teen organizers and a separate development team,
      setting scope and specs for both and keeping them in sync ahead of a fixed
      event date. I also built the project review and submission flows in
      Next.js for the event platform, which served 1,500 users, and reviewed
      several hundred project submissions from attendees who traveled from more
      than 10 countries.
    thumbnail: /thumbnails/ShipwreckedGroupPhoto-webp.webp
    websiteURL: https://shipwrecked.hackclub.com
    categories:
      - Hackathons
      - Highlights
    videoURL: https://www.youtube.com/watch?v=uXWMr0gdLJA
  - date: Nov, 2025 - Aug, 2026
    name: Horizons
    tagline: >-
      Managed $200K across a global series of six hackathons, leading local
      teams and running operations on site in Berlin and San Francisco.
    description: >-
      Horizons was a Hack Club series of six hackathons around the world. As
      Senior Event Manager, I managed $200,000 of spend across the series,
      building the budgets and tracking every event to plan. I led the local
      organizing teams for all six events and ran operations on the ground at
      Europa in Berlin and Nexus in San Francisco.


      The day before one event, we found bed bugs at the hostel we had reserved.
      I rebooked lodging for 70 attendees, and the event still closed with an
      NPS of 84.


      I also worked on the Horizons platform, which served 6,500 participants. I
      built the project review and submission flows in SvelteKit and NestJS
      alongside a distributed team, working through shared specs and code
      review. Using support tickets and organizer feedback, I redesigned the
      submission experience to cut steps out of the user flow, with the goal of
      raising retention.
    thumbnail: /thumbnails/1789569010889-webp.webp
    categories:
      - Hackathons
      - Highlights
    websiteURL: https://horizons.hackclub.com
  - date: Apr 2025-May 2026
    name: Slack Ticketing Bot
    tagline: >-
      A Slack ticketing bot that handled hundreds of tickets a day during live
      Hack Club events.
    description: >-
      I built this bot with two goals: never lose track of a question, and
      resolve questions as quickly as possible. It ran in production during live
      Hack Club events and handled hundreds of tickets a day.


      The bot went through many iterations. My first version used AI to reply to
      questions with a bit of context about the event. That failed because the
      AI didn't have enough context, so it hallucinated answers and confidently
      told people the wrong thing. I replaced it with a constrained system that
      only links matching FAQ entries. This worked much better and resolved
      around half of our tickets before a volunteer had to reply.
    thumbnail: /thumbnails/placeholder.svg
    categories:
      - Programming
    githubURL: https://github.com/evan-gan/ticketSlackBot
  - date: Mar 15, 2025
    name: Scrapyard Hackathon
    tagline: >-
      Organized and ran a 12-hour hackathon at the Microsoft NERD Center with 60
      teen attendees. (Second hackathon organized)
    description: >-
      I organized a 60-person Boston Scrapyard Hackathon, part of a global
      series with 75 simultaneous events. I led a team of organizers, raised
      $1K, and secured a donated venue. I handled teacher and student outreach
      to recruit attendees. I also took the marketing materials from my previous
      hackathon project, Counterspell, and made them more generic so they could
