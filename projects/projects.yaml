  - date: Aug-Sep, 2026
    name: WPI Planner Refresh
    tagline: >-
      A port of WPI's course planner to SvelteKit with faster load times and
      calendar export.
    description: >-
      The WPI planner is a site students at WPI use to plan their courses and
      avoid schedule conflicts. I ported it from a legacy Java and HTML
      framework to SvelteKit, keeping conflict detection working across the full
      course catalog. Along the way, I compressed the class data to cut load
      time and added a way for students to export their schedules to an external
