  - date: Sep - Nov, 2024
    name: Pumpkin Smash
    tagline: >-
      Built & designed an 8 foot tall guillotine to smash pumpkins at my city's
      annual pumpkin composting event 
    description: >-
      Each year, the LigerBots, my FIRST Robotics team, design and build a
      pumpkin smasher for Newton's annual Pumpkin Smash composting event. In
      2024, I proposed, designed (in Onshape), and led the build of an
      eight-foot-tall guillotine to smash pumpkins for composting. I created the
      design in Onshape, taught teammates to use woodworking and power tools,
      and coordinated a team of about twenty students through construction. The
      guillotine both entertained the community and sped up composting, turning
      pumpkin waste into soil while showcasing engineering, leadership, and
      sustainability in action.
    thumbnail: /thumbnails/1759760697739-webp.webp
    categories:
      - Builds
      - Robotics
  - date: May 17-19, 2024
    name: Apocalypse Hackathon Device
    tagline: >-
      Peer-to-peer communication device built for an apocalypse-themed
      hackathon.
    description: >-
      The prompt for Apocalypse was to create something to help you survive the
      zombie apocalypse. We thought that since the internet would be unreliable
      during the apocalypse, it would be helpful to have devices that allow you
      to communicate regardless!


      Infromedead is a set of devices that can communicate with each other off
      the grid!


      The code runs on ESP32s, and the devices work by each setting up their own
      WiFi access points. From there, if a device wants to send a message, it
      simply connects to the access point of the one it's sending to and sends
      its message via the WiFi.


      All the inputs come from the keypads connected to the ESP32s which are set
      up somewhat like phone keypads, allowing the user to type any letter or
      number.
    thumbnail: /thumbnails/1760215838683-webp.webp
    githubURL: https://github.com/EerierGosling/Informedead
    categories:
      - Builds
  - date: May, 2024
    name: Maze Generator
    tagline: >-
      Recursive TypeScript maze generator for a pen plotter in the Hack Club
      Blot ecosystem.
    description: >-
      This project is a recursive maze generator written in TypeScript for the
      Hack Club Blot ecosystem, designed to create generative mazes optimized
      for pen plotting through a custom tool path algorithm I built. The maze
      generation follows a simple recursive process of breaking walls, marking
      visited cells, and backtracking when no unvisited paths remain. While the
      algorithm itself was straightforward, developing the maze structure and
      optimizing the plotting efficiency proved to be the most rewarding
      challenge. I taught myself TypeScript and Node.js for this project,
      building on previous experience with C++, Swift, and Arduino. The
      generator can create mazes at any position on the page with fully
      customizable dimensions for rows, columns, and cell sizes. My work was
      merged into the open source Blot repository.
    thumbnail: >-
      https://raw.githubusercontent.com/hackclub/blot/main/art/mazeGenerator-Evan/snapshots/mazeThumbnail.svg
    githubURL: https://github.com/hackclub/blot/pull/230
    categories:
      - Programming
  - date: May, 2024
    name: Wordle Solver
    tagline: >-
      A scalable Swift-based solver that cracks any Wordle variant using ranked
      word heuristics.
    description: >-
      Curious about how efficiently a program could solve Wordle, I built a
      solver as my first project in Swift to learn the language. It works with
      all Wordle variants (including Absurdle) and supports longer word lengths.
      The solver takes your game feedback, filters through a 333,000-word
      dataset, and ranks possible answers by vowel diversity, letter repetition,
      frequency, and usage weight. The result is a fast, data-driven tool that
      quickly identifies the best next guess.
    thumbnail: /thumbnails/1760284204583-webp.webp
    githubURL: https://github.com/evan-gan/wordleSolver
    categories:
      - Programming
  - date: April-July, 2024
    name: Off the Grid Communicator Circuit Board
    tagline: >-
      Built off the grid texting device for a hackathon on the Pacific Crest
      Trail, without cell service
    description: >-
      I had an idea for building a texting device for a seven-day off-the-grid
      hike. I enlisted a small team of friends from around the world excited by
      the idea, and we worked on a circuit board and firmware project to bring
      it to life. I learned how to design a circuit board for the first time
      using EasyEDA, designed the circuits and roughly two thirds of the board
      layout, including a full mini keyboard, and optimized it for long-lasting
      battery life so it could run for eight days of constant use. The device
      uses LoRa radio, and I tuned it for far range communications, allowing it
      to communicate over a mile without cell towers or any external
      infrastructure. I coordinated manufacturing in China, and we distributed
      about 20 units for the other hikers in our group to use during the hike. I
      also wrote the firmware from scratch and gained hands-on experience
      soldering while assembling the components. Throughout the project, I
      collaborated closely with my friends on both the design and software,
      learning a great deal about electronics and teamwork.
    thumbnail: /thumbnails/1760206485488-webp.webp
    githubURL: https://github.com/evan-gan/trail-PCB-communication-network
    categories:
      - Builds
    videoURL: https://www.youtube.com/watch?v=ufMUJ9D1fi8
  - date: Mar 1-2, 2024
    name: Distractatime
    tagline: >-
      Built an anti-productivity Mac app for the "useless project" prompt at a
      12-hour hackathon.
    description: >-
      For the Scrapyard Flagship Hackathon, we were prompted to make a useless
      project. What better than an anti-productivity app to fulfill this
      objective.


      Using SwiftUI, we developed a MacOS application which tracks the amount of
      time you spend coding, and deploys various distractions to prevent you
      from being productive.


      If you try to code for an excessive amount of time, productivity
      countermeasures such as repeatedly changing the font in VSCode to fonts
      like Wingdings will be deployed. However, if the user continues to attempt
      to code, further distractions will be implemented, such as opening
      #confessions (a channel on the Hack Club Slack notorious for being a
      distraction) and playing Subway Surfers with very loud volume. As a last
      resort, siren noises will play, annoying windows will spawn and move
      across the screen, with a loud balloon popping as a final deterrent. What
      a practical solution to an impractical problem!
    thumbnail: /thumbnails/scrapyardFlagship-webp.webp
    githubURL: https://github.com/evan-gan/distractatime
    categories:
      - Programming
  - date: Sep 2022 - June 2026
    name: The LigerBots
    tagline: >-
      The LigerBots - First robotics team 2877 for Newton North and South High
      Schools. Newton MA
    description: >-
      Freshman year, I joined my high school's 80 person robotics team, the
      LigerBots, which competes among 3,500 teams worldwide in FIRST Robotics.
      Over my four years on the team, I’ve become a jack of all trades,
      programming the robot, leading build and prototyping groups to design and
      construct mechanisms, and creating CAD models for robot components in
      Onshape. I also trained underclassmen on CAD and shop tools.


      As a sophomore Build Lead, I prototyped a climbing mechanism with hand
      tools when machine time ran out, and that design made it onto our 2024
      competition robot. As a junior, I served as VP of Technical Research,
      pitching new mechanism concepts that shaped which designs the team carried
      into the season. As Build Lead that year, I led a group of 10 students in
      manufacturing a robot elevator with more than 200 unique parts, machining
      roughly 50 by hand and CNCing another 50.


      As a senior, I was appointed Chief Operating Officer (COO), running
      operations for the 80 person team, including logistics, waivers, budget
      tracking, and carpool coordination for 50 or more students per event. I
      was also lead programmer, programming the competition robot in Java with
      WPILib, teaching underclassmen to write and ship code, and pushing for
      automated routines that helped the team reach the Einstein field at
      Worlds.


      During my time with the LigerBots, we progressed from qualifying for the
      District Championship to competing at the World Championship, winning our
      division at Worlds in both 2025 and 2026. We were one of only five teams
      to win our division both years. We also won the FIRST Impact Award, the
      most prestigious award in FIRST, at the 2024 Greater Boston District
      qualifier and the 2026 North Shore qualifier. In my junior year, I was
      awarded my team's Gracious Professionalism Award.
    thumbnail: /thumbnails/1760310168343-webp.webp
    categories:
      - Robotics
      - Highlights
    websiteURL: ligerbots.org
  - date: Oct 5, 2021
    name: Little Free Library
    tagline: Designed and built a Little Free Library from scratch in Tinker CAD
    description: >-
      I designed a Little Free Library from scratch using TinkerCAD, the first
      CAD software I learned. After completing the design, I gathered materials
      and taught myself to use power tools such as a table saw, drill, and
      pneumatic nail gun to build it. Wanting to do the job right, I reached out
      to people in my community and found some who had recently re-roofed their
      houses and were willing to share leftover shingles and tar mat. I
      purchased some drip edge from Home Depot and constructed the roof just
      like a real house. For the front, I wanted a full-sized window, so I built
      a custom frame with slots and repurposed an acrylic face shield to create
      a large, clear window. Several years later, it still stands strong, having
      endured many wind and snow storms.


      Neighbors still stop by everyday to pick up or drop off books!
    thumbnail: /thumbnails/1759675385330-webp.webp
    categories:
      - Builds
