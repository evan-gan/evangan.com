  - date: Jun, 2026
    name: Passport Photo Maker
    tagline: A free, open source website that crops photos to passport standards.
    description: >-
      I was frustrated by how many websites charge you to make a photo meet
      passport photo standards, which usually just means rotating it level and
      cropping it to the right size. So I made a site that does it for free. It
      uses computer vision to detect a face, automatically corrects the image's
      rotation, and crops the face to the correct size. It's also free and open
      source!
    thumbnail: /thumbnails/1789568743516-webp.webp
    categories:
      - Programming
    githubURL: https://github.com/evan-gan/PassportPhotoMaker
  - date: Jun-Jul, 2026
    name: CoreXY Pen Plotter
    tagline: >-
      A 2' by 2' CoreXY pen plotter I designed, built, and exhibited at Open
      Sauce.
    description: >-
      After being inspired by Hack Club's [Blot](https://blot.hackclub.com), I
      wanted to make a large scale pen plotter. I also wanted to learn about the
      CoreXY belt drive system, which mounts both motors that drive the XY
      gantry to the frame. With less mass moving around, the plotter can travel
      faster. I modeled the frame and gantry in Onshape, which sharpened my CAD
      skills, and exhibited the finished machine at Open Sauce.
    thumbnail: /thumbnails/1788642542809-webp.webp
    categories:
      - Builds
    githubURL: https://github.com/evan-gan/plotter
  - date: Mar-Sep, 2026
    name: Tract
    tagline: An iPad note taking app with an infinite canvas and problem tagging.
    description: >-
      I tried out a bunch of note taking apps, but none of them had everything I
      wanted in a note taking app:

      - An infinite canvas to avoid cramped handwriting

      - Problem tagging for clean exports (notes automatically group by problem,
      so it's clear what is what when you export)

      - A minimalist, clean UI


      So I built my own in Swift. The source is public on GitHub, so check it
      out and compile it for yourself if you'd like. (coming to tesflight soon!)
    thumbnail: /thumbnails/placeholder.svg
    categories:
      - Programming
    githubURL: https://github.com/evan-gan/Tract
  - date: Nov, 2025
